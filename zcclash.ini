[custom]
;实际应用应尽量删减，在达到自己目的的情况下做到最简化，否则会造成网络卡顿和延迟！！！！！

; ==========================
; 1. 规则集定义 (按四层结构排序)
; ==========================

; --- 第一层：直连/白名单 (优先匹配，确保国内/局域网不走代理) ---
ruleset=🎯 局域网,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 微信,https://whatshub.top/rule/WeChat.list
ruleset=🎯 自定义直连,https://raw.githubusercontent.com/xinhua16/clash/refs/heads/main/zhidingyi.list
ruleset=🎯 全球直连,[]GEOSITE,CN
ruleset=🎯 全球直连,[]GEOIP,CN

; --- 第二层：特定应用代理 (精准分流，必须放在兜底规则之前) ---
ruleset=📹 YouTube,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🎥 Netflix,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
