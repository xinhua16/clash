ruleset=📲 Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=📲 Twitter,https://whatshub.top/rule/Twitter.list
ruleset=📲 Facebook,https://whatshub.top/rule/Facebook.list
ruleset=📲 Instagram,https://whatshub.top/rule/Instagram.list
ruleset=📲 Reddit,https://whatshub.top/rule/Reddit.list
ruleset=📲 PayPal,https://whatshub.top/rule/PayPal.list
ruleset=🎵 Spotify,https://whatshub.top/rule/Spotify.list
ruleset=🤖 AI,https://whatshub.top/rule/ai.list
ruleset=📢 FCM,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GoogleFCM/GoogleFCM.list
ruleset=👨🏿‍💻 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list
ruleset=🐬 OneDrive,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OneDrive/OneDrive.list
